name: web-api-discovery

# The skill lives in web-api-discovery/ and its suites assume they run from
# there, so every run step starts in that folder. Only a change to the skill
# or this workflow triggers it.
on:
  push:
    branches: [main]
    paths: ["web-api-discovery/**", ".github/workflows/web-api-discovery.yml"]
  pull_request:
    paths: ["web-api-discovery/**", ".github/workflows/web-api-discovery.yml"]

jobs:
  pester:
    name: web-api-discovery / Pester tests
    # The self-hosted build runner. Unlike a GitHub-hosted image it persists
    # between jobs, shares its host with other runners, and its user has no
    # sudo -- so no step below may need sudo for a tool the host already has,
    # write outside the job's own folders, or claim a fixed display number.
    runs-on: [self-hosted, linux, build]
    defaults:
      run:
        working-directory: web-api-discovery
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # THE BROWSER DRIVER, so the capture tests that attach to a real browser
      # actually run here. Without it capture-native-attach.test.js skips its two
      # end-to-end cases and this job reports green having never once attached to
      # a browser -- the same false assurance #304 removed from the gate itself.
      # The test turns a missing driver into a FAILURE whenever CI is set, the
      # way GitleaksGuard.ps1 does for gitleaks, so this step is required.
      #
      # NOT `npm install -g playwright`, and the difference is load-bearing.
      # capture-preflight.test.js asserts as a PRECONDITION that npm's global
      # root holds no playwright: its subprocess cases spawn the real recorder,
      # which derives the global root from the host platform whatever the
      # fixture environment says, so a global install would make every "the
      # module is absent" case pass while testing nothing.
      #
      # NOR IS NODE_PATH EXPORTED FOR THE WHOLE JOB, which was the first attempt
      # and is measurably wrong: `require.resolve(name, { paths: [dir] })` still
      # falls back to Module.globalPaths, and NODE_PATH is in it. Those paths are
      # captured when the process starts, so the `env` object a test hands the
      # resolver cannot suppress them -- `childEnv()` protects the SUBPROCESS
      # cases, and the in-process ones resolve inside the test process itself.
      # Exporting it turned ten of those into failures.
      #
      # So the path is published under a name only the test that wants a driver
      # reads, and that test puts it on NODE_PATH for the recorder it spawns --
      # per invocation, which is exactly what NODE_PATH is for and what the
      # recorder documents as its fourth location. Nothing else in the job can
      # see it. The install also stays out of the repository, which the same
      # precondition checks: a node_modules above the recorder would answer for
      # the tool location.
      #
      # No browser download. These capture modes drive the SYSTEM Chrome with no
      # automation flags -- Playwright's own Chromium is not a dependency of
      # theirs, and fetching it would add a minute to every run for nothing.
      - name: Install the Playwright driver (reached by NODE_PATH, never globally)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playwright-home"
          cd "$RUNNER_TEMP/playwright-home"
          npm install --no-audit --no-fund --no-package-lock --no-save playwright
          echo "HAR_CAPTURE_TEST_NODE_PATH=$RUNNER_TEMP/playwright-home/node_modules" >> "$GITHUB_ENV"

      # A headful browser needs somewhere to draw. The native capture mode
      # launches Chrome with NO automation flags, and --headless is exactly the
      # kind of flag it exists to avoid -- so the display is provided rather than
      # the browser being told it does not need one. Without this, Chrome exits
      # immediately with "Missing X server or $DISPLAY" and the attach times out.
      - name: Start a virtual display, and report the Chrome the tests will drive
        run: |
          set -euo pipefail
          # The build host has Xvfb already; apt runs only on an image without it.
          if ! command -v Xvfb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          # -displayfd: Xvfb takes a free display and writes its number once it
          # is ready. A fixed :99 may be held on a shared, persistent host, by
          # another runner's job or by the lock a killed job left behind.
          Xvfb -displayfd 3 -screen 0 1280x1024x24 3>"$RUNNER_TEMP/xvfb-display" >/dev/null 2>&1 &
          for _ in $(seq 100); do [ -s "$RUNNER_TEMP/xvfb-display" ] && break; sleep 0.1; done
          [ -s "$RUNNER_TEMP/xvfb-display" ] || { echo 'Xvfb did not start within 10 seconds' >&2; exit 1; }
          echo "DISPLAY=:$(tr -d '[:space:]' < "$RUNNER_TEMP/xvfb-display")" >> "$GITHUB_ENV"
          # Diagnostics only -- the test owns the decision about a missing
          # browser, and names every path it looked in when it fails.
          google-chrome --version || echo 'google-chrome is not on PATH'

      # .NET is optional: the agent-e2e build/test blocks skip when the SDK is
      # absent. Installing it here makes CI exercise the full pipeline on the
      # emitted wrapper project.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Without gitleaks on PATH the secret-detection tests would skip and the
      # suite would still report green. GitleaksGuard.ps1 turns a missing
      # binary into a failure whenever CI is set, so this step is required.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          # Into this job's temp folder and onto the PATH of the steps after it:
          # the runner's user has no sudo, and a job must not leave a binary in
          # the host's /usr/local/bin for the next job of another repository.
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
          PATH="$bin:$PATH"
          gitleaks version

      # The gate resolves test files itself: `.github` is hidden on Linux and
      # Pester's own discovery skips hidden paths, which once let this job
      # report success while running zero tests.
      - name: Run Pester suite
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          ./.github/ci/Invoke-PesterSuite.ps1 -Path ./tests, ./.github/ci/tests, ./Install.Tests.ps1

      # Node runs the Node suites. Until #94 the only way one reached a pull
      # request was a Pester wrapper in tests/ that shelled out to `node <file>`
      # and asserted exit 0 -- which made Pester the runner for Node tests, and
      # made "write a wrapper" a rule a contributor had to know or silently lose
      # their coverage. These suites are zero-dep self-running scripts; nothing
      # here uses `node:test`, so no runner is needed, only discovery and a
      # non-zero exit. The same command runs locally.
      #
      # IN THIS JOB ON PURPOSE, after the environment above: several of these
      # suites need the Playwright driver, the virtual display and the .NET SDK
      # it installs, and standing up a second job with that environment would
      # duplicate all of it to buy nothing.
      #
      # `!cancelled()` so a red Pester step does not hide the Node results. The
      # two gate independently, and a run that reports one failure at a time
      # costs a round trip per failure.
      - name: Run the Node test suites
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/Invoke-NodeTestSuite.ps1
