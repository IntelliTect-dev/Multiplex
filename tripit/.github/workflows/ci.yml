name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore TripItEx.slnx

      - name: Build
        run: dotnet build TripItEx.slnx --no-restore -c Release

      - name: Test (no live API; SkippableFact will skip backend tests)
        run: dotnet test TripItEx.slnx --no-build -c Release --logger "trx;LogFileName=test.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Install Pester 5.x
        shell: pwsh
        run: |
          # Pin to 5.x: these are Pester 5 tests, and -MinimumVersion alone installed
          # Pester 6, whose breaking changes the suite was never written against.
          Install-Module -Name Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 `
            -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester
        shell: pwsh
        run: |
          Invoke-Pester -Path tests/TripIt.PowerShell.Tests -CI -Output Detailed

  functional-tests:
    name: Functional tests (live API)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    needs: build-test
    env:
      TRIPIT_COOKIE: ${{ secrets.TRIPIT_COOKIE }}
      TRIPIT_CSRF:   ${{ secrets.TRIPIT_CSRF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Functional tests
        run: dotnet test tests/TripIt.FunctionalTests/TripIt.FunctionalTests.csproj -c Release
