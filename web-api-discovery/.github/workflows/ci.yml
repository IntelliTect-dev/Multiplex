name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pester:
    name: Pester tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # .NET is optional: the agent-e2e build/test blocks skip when the SDK is
      # absent. Installing it here makes CI exercise the full pipeline on the
      # emitted wrapper project.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Without gitleaks on PATH the secret-detection tests would skip and the
      # suite would still report green. GitleaksGuard.ps1 turns a missing
      # binary into a failure whenever CI is set, so this step is required.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The gate resolves test files itself: `.github` is hidden on Linux and
      # Pester's own discovery skips hidden paths, which once let this job
      # report success while running zero tests.
      - name: Run Pester suite
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          ./.github/ci/Invoke-PesterSuite.ps1 -Path ./tests, ./.github/ci/tests, ./Install.Tests.ps1
